name: Publish ROM release

on:
  push:
    tags:
      - "lineage-23.0-*"

permissions:
  contents: write

concurrency:
  group: "release-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: "${{ github.token }}"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned asset source from annotated tag
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "ERROR: $*" >&2; exit 1; }
          tag_type="$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")"
          [[ "${tag_type}" == tag ]] || fail "${GITHUB_REF_NAME} must be an annotated tag"
          tag_message="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')"
          mapfile -t base_urls < <(printf '%s\n' "${tag_message}" | sed -n 's/^asset-base-url=//p')
          mapfile -t manifest_hashes < <(printf '%s\n' "${tag_message}" | sed -n 's/^manifest-sha256=//p')
          [[ "${#base_urls[@]}" -eq 1 ]] || fail "tag message must contain exactly one asset-base-url= line"
          [[ "${#manifest_hashes[@]}" -eq 1 ]] || fail "tag message must contain exactly one manifest-sha256= line"
          base_url="${base_urls[0]}"
          manifest_sha256="${manifest_hashes[0]}"
          [[ "${base_url}" == https://* ]] || fail "asset-base-url must use HTTPS"
          [[ "${manifest_sha256}" =~ ^[0-9a-f]{64}$ ]] || fail "manifest-sha256 must be 64 lowercase hexadecimal characters"
          echo "ASSET_BASE_URL=${base_url%/}" >> "${GITHUB_ENV}"
          echo "MANIFEST_SHA256=${manifest_sha256}" >> "${GITHUB_ENV}"

      - name: Download and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          curl --fail --location --retry 8 --retry-all-errors \
            --output release-assets/release-assets.sha256 \
            "${ASSET_BASE_URL}/release-assets.sha256"
          printf '%s  %s\n' "${MANIFEST_SHA256}" release-assets/release-assets.sha256 \
            | sha256sum -c -

          while read -r expected filename; do
            [[ "${expected}" =~ ^[0-9a-f]{64}$ ]] || { echo "ERROR: malformed asset digest" >&2; exit 1; }
            [[ "${filename}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "ERROR: unsafe asset filename: ${filename}" >&2; exit 1; }
            curl --fail --location --retry 8 --retry-all-errors \
              --output "release-assets/${filename}" \
              "${ASSET_BASE_URL}/${filename}"
          done < release-assets/release-assets.sha256

          (cd release-assets && sha256sum -c release-assets.sha256)

      - name: Create GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --verify-tag \
            --prerelease \
            --title "LineageOS 23 for Nothing Phone (3) - ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
